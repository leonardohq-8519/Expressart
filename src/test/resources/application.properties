spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

cors.allowed-origins=http://localhost:3000

jwt.secret=test-secret-key-for-testing-purposes-only-32chars
jwt.expiration=3600000

aws.access.key.id=test-access-key
aws.secret.access.key=test-secret-key
aws.region=us-east-1

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

oauth2.redirect-url=http://localhost:3000/oauth2/callback

stripe.secret-key=test-stripe-key
stripe.webhook-secret=test-webhook-secret

spring.data.redis.host=localhost
spring.data.redis.port=6379
